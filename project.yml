name: VPNSpawner
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
targets:
  VPNSpawner:
    type: application
    platform: iOS
    sources:
      - path: VPNSpawner
        excludes:
          - "**/README.md"
      - path: controller/bootstrap.sh
        buildPhase: resources
    entitlements:
      path: VPNSpawner/VPNSpawner.entitlements
      properties:
        com.apple.developer.networking.vpn.api:
          - allow-vpn
    info:
      path: VPNSpawner/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only Apple's crypto: IKEv2 via NetworkExtension, HTTPS, CryptoKit HMAC request signing.
        # See docs/release/listing.md "Export compliance".
        ITSAppUsesNonExemptEncryption: false
        # Nodes are reached by bare IP over HTTP (/health, /sub, profile); no TLS possible.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "VPN Spawner"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
schemes:
  VPNSpawner:
    build:
      targets:
        VPNSpawner: all
    run:
      config: Debug
    archive:
      config: Release
